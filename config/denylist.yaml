# Empresas que NO son cliente final, agrupadas por categoria.
# Cada categoria se mapea a un bloque del informe:
#   agency      -> Bloque B (senal de competencia)
#   consultancy -> Bloque C (intermediarios)
#   staffing    -> Bloque C (intermediarios)
#
# "match: exact" desactiva el fuzzy para esa entrada. Usalo en nombres cortos o
# propensos a colision (Indra, VASS, GFT, Babel, Sngular...). Sin esto, "Sngular"
# arrastraria a "Singular Bank" y "Babel" a cualquier empresa con esa raiz.

categories:
  agency:
    label: "Agencia / estudio digital"
    block: B
    reading: "Competencia directa de 2894. Que contraten junior = hay demanda en el mercado."
  consultancy:
    label: "Consultora IT / ESN"
    block: C
    reading: "Intermediario. El cliente final esta detras y a veces se intuye en la oferta."
  staffing:
    label: "Seleccion / ETT / headhunting"
    block: C
    reading: "Intermediario puro. La empresa real va anonimizada en la oferta."

