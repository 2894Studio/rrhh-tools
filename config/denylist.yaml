# Palabras clave en el NOMBRE. SOLO modificador (+-0.15), NUNCA decisivo por si solas.
# Sin esta regla, "Prosegur Solutions", "Digital Origin" o "Glovo Labs" caerian
# injustamente por contener "solutions" / "digital" / "labs". Hay un test que lo cubre.
name_keywords:
  agency: [agencia, agency, studio, estudio, creative, creativos, comunicacion, publicidad, branding]
  consultancy: [consultora, consulting, consultores, consultancy, advisory, tecnologias, sistemas]
  staffing: [staffing, recruit, recruiting, reclutamiento, seleccion, talent, talento, rrhh,
             interim, headhunt, headhunting, empleo, ett, personal, outplacement]

# Patrones en la DESCRIPCION de la oferta. Pesos sumables.
# La senal mas potente de intermediario es que la empresa real vaya anonimizada.
description_patterns:
  staffing:
    weight: -3
    patterns:
      - "para uno de nuestros clientes"
      - "nuestro cliente busca"
      - "nuestro cliente es"
      - "importante empresa del sector"
      - "empresa lider en su sector"
      - "reconocida empresa del sector"
      - "seleccionamos para"
      - "proceso de seleccion para nuestro cliente"
      - "nuestro cliente, una"
      - "on behalf of our client"
      - "our client is looking"
      - "headhunting"
      - "empresa de trabajo temporal"
  agency:
    weight: -2
    patterns:
      - "nuestros clientes"
      - "proyectos de cliente"
      - "client projects"
      - "multi-cliente"
      - "somos una agencia"
      - "somos una consultora"
      - "partner tecnologico"
      - "fabrica de software"
      - "outsourcing"
      - "en las oficinas del cliente"
      - "clientes de diferentes sectores"
      - "cartera de clientes"
  end_client:
    weight: 2
    patterns:
      - "nuestro producto"
      - "our product"
      - "nuestros usuarios"
      - "our users"
      - "nuestra app"
      - "nuestra plataforma"
      - "in-house"
      - "equipo interno de diseno"
      - "roadmap de producto"
      - "product roadmap"
      - "nuestro equipo de producto"
      - "nuestros clientes finales"

# Campo "Sector" de LinkedIn.
li_industries:
  deny_strong:   # 0.80
    - "Staffing and Recruiting"
    - "Human Resources Services"
    - "Advertising Services"
    - "Design Services"
    - "Marketing Services"
    - "Public Relations and Communications Services"
  deny_weak:     # 0.60 - NUNCA decisivo: las empresas de producto se auto-etiquetan asi constantemente
    - "IT Services and IT Consulting"
    - "Business Consulting and Services"
  allow:         # +0.15 de modificador hacia cliente final
    - "Banking"
    - "Financial Services"
    - "Insurance"
    - "Retail"
    - "Telecommunications"
    - "Hospitality"
    - "Food and Beverage Services"
    - "Broadcast Media Production and Distribution"
    - "Software Development"
    - "Motor Vehicle Manufacturing"
    - "Airlines and Aviation"
    - "Utilities"
    - "Hospitals and Health Care"
    - "Real Estate"
    - "Education"
