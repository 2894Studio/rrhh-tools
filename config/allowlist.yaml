# Clientes finales conocidos del mercado espanol.
# Esta lista se comprueba ANTES que el fuzzy matching, y eso es deliberado:
# es la proteccion que evita que "Singular Bank" colisione con "Sngular" (consultora)
# o que "Prosegur Solutions" caiga por contener "solutions".
#
# Anade aqui cualquier empresa que el clasificador marque mal como intermediario.

