# Tabla de casos del clasificador de nivel Y de rol.
#
# Ojo al cambio de criterio: el nivel ya NO decide quien entra. Lo unico que
# sale del pipeline es NOT_DESIGN. Un "Senior Product Designer" se etiqueta
# senior y SE QUEDA en el listado; antes se tiraba.
#
# Las trampas estan puestas a proposito: titulos que mezclan niveles, palabras
# que contienen un termino de nivel dentro de otra palabra, y roles que se
# solapan (AI Product Designer es AI, no producto).
casos:
  # --- lead: manda sobre senior y sobre junior ---
  - {titulo: "Head of Design", nivel: LEAD, rol: OTRO}
  - {titulo: "Design Manager", nivel: LEAD, rol: OTRO}
  - {titulo: "Director de Diseño", nivel: LEAD, rol: OTRO}
  - {titulo: "Responsable de Diseño UX", nivel: LEAD, rol: UX}
  - {titulo: "Lead UX Designer", nivel: LEAD, rol: UX}
  - {titulo: "Principal Designer", nivel: LEAD, rol: OTRO}
  - {titulo: "Staff Product Designer", nivel: LEAD, rol: PRODUCT}
  - {titulo: "Senior Design Lead", nivel: LEAD, rol: OTRO}

  # --- senior ---
  - {titulo: "Senior Product Designer", nivel: SENIOR, rol: PRODUCT}
  - {titulo: "Sr. UX Designer", nivel: SENIOR, rol: UX}
  - {titulo: "Diseñador UX Sénior", nivel: SENIOR, rol: UX}
  - {titulo: "Product Designer II", nivel: SENIOR, rol: PRODUCT}
  - {titulo: "UX Designer III", nivel: SENIOR, rol: UX}
  - {titulo: "Arquitecto de Experiencia de Usuario", nivel: SENIOR, rol: UX}
  # Cubre dos niveles: se cuenta como el mas alto, por prudencia.
  - {titulo: "Junior/Senior UX Designer", nivel: SENIOR, rol: UX}

  # --- junior explicito, en ingles y en espanol ---
  - {titulo: "Junior UX/UI Designer", nivel: JUNIOR, rol: UXUI}
  - {titulo: "Jr Product Designer", nivel: JUNIOR, rol: PRODUCT}
  - {titulo: "Diseñador/a UX/UI Junior", nivel: JUNIOR, rol: UXUI}
  - {titulo: "Diseñadora UI Junior", nivel: JUNIOR, rol: UI}
  - {titulo: "Becario Diseño UX", nivel: JUNIOR, rol: UX}
  - {titulo: "Becaria de Diseño de Producto", nivel: JUNIOR, rol: PRODUCT}
  - {titulo: "Prácticas Diseño de Producto", nivel: JUNIOR, rol: PRODUCT}
  - {titulo: "Trainee UX Designer", nivel: JUNIOR, rol: UX}
  - {titulo: "Graduate Product Designer", nivel: JUNIOR, rol: PRODUCT}
  - {titulo: "Entry Level UI Designer", nivel: JUNIOR, rol: UI}
  - {titulo: "UX Design Intern", nivel: JUNIOR, rol: UX}
  - {titulo: "Diseñador Gráfico Junior", nivel: JUNIOR, rol: OTRO}

  # --- mid: un titulo sin marca de nivel es mid, no "ambiguo" ---
  - {titulo: "Product Designer", nivel: MID, rol: PRODUCT}
  - {titulo: "UX/UI Designer (m/f/d)", nivel: MID, rol: UXUI}
  - {titulo: "UX Researcher", nivel: MID, rol: UX}
  - {titulo: "UI Designer", nivel: MID, rol: UI}
  - {titulo: "Visual Designer", nivel: MID, rol: UI}
  - {titulo: "Diseñador de Producto", nivel: MID, rol: PRODUCT}
  - {titulo: "Associate Designer", nivel: MID, rol: OTRO}
  - {titulo: "Especialista en Experiencia de Usuario", nivel: MID, rol: UX}

  # --- diseno con IA: gana siempre sobre el resto de roles ---
  - {titulo: "AI Designer", nivel: MID, rol: AI}
  - {titulo: "AI Product Designer", nivel: MID, rol: AI}
  - {titulo: "Senior AI Product Designer", nivel: SENIOR, rol: AI}
  - {titulo: "Junior AI Designer", nivel: JUNIOR, rol: AI}
  - {titulo: "Prompt Designer", nivel: MID, rol: AI}
  - {titulo: "Conversational Designer", nivel: MID, rol: AI}
  - {titulo: "Diseñador UX con Inteligencia Artificial", nivel: MID, rol: AI}

  # --- lo unico que sigue saliendo del pipeline ---
  - {titulo: "Interior Designer", nivel: NOT_DESIGN, rol: OTRO}
  - {titulo: "Diseñador Industrial Junior", nivel: NOT_DESIGN, rol: OTRO}
  - {titulo: "Diseñador Textil", nivel: NOT_DESIGN, rol: OTRO}
  - {titulo: "Fashion Designer", nivel: NOT_DESIGN, rol: OTRO}
  - {titulo: "Instructional Designer", nivel: NOT_DESIGN, rol: OTRO}
  - {titulo: "Backend Engineer", nivel: NOT_DESIGN, rol: OTRO}
  - {titulo: "Product Manager", nivel: NOT_DESIGN, rol: OTRO}
  # Trampa: contiene "head" dentro de otra palabra.
  - {titulo: "Headless CMS Developer", nivel: NOT_DESIGN, rol: OTRO}
