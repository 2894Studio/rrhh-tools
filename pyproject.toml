[project]
name = "rrhh-tools"
version = "0.1.0"
description = "Radar de ofertas Junior Design en LinkedIn -> cuentas objetivo para 2894"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "lxml>=5.0",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
rrhh-tools = "rrhh_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrhh_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real network; deselected by default, user machine only"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
